$("labVisual").innerHTML=`<svg viewBox="0 0 380 220" role="img" aria-label="${["Carré quadrillé","Triangle ABC rectangle en A","Triangles AMN et ABC avec MN parallèle à BC"][current]}">${svg}</svg>`;$("vout").textContent=v+" cm";$("measure").textContent=measure
}
function checkLab(){if(lab.done){newLab();renderLesson(false);return}let ok=lab.value===lab.target;lab.right=ok;tone(ok);
if(ok){lab.done=true;gain(5);lab.msg=["Exact ! La racine carrée de "+lab.target**2+" est "+lab.target+".","Exact ! Les carrés des deux côtés donnent bien le carré de l’hypoténuse cible.","Exact ! Les deux rapports sont égaux à "+fr(lab.target/10)+"."][current]+" +5 XP.";$("slider").disabled=true;$("checkLab").innerHTML="Nouvelle construction "+icon("arrow",16)}
else{lab.msg=(lab.value<lab.target?"Pas encore : augmente":"Pas encore : diminue")+" "+["le côté du carré.","la longueur AC.","la longueur AM."][current]+" Observe le calcul sous la figure."}
$("labMsg").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${lab.msg}</div>`
}
const make=(q,a,others,why,hint)=>({q,a,others,why,hint});
const bank=[
 [
 make("Quelle est la forme simplifiée de √48 ?","4√3",["3√4","16√3","8√3"],"48 = 16 × 3, donc √48 = √16 × √3 = 4√3.","Cherche le plus grand carré parfait qui divise 48."),
 make("Que vaut √((-7)²) ?","7",["−7","49","−49"],"√(x²) = |x|. Une racine carrée est toujours positive ou nulle.","La racine carrée désigne le nombre non négatif."),
 make("Simplifie 3√5 + 2√5.","5√5",["5√10","6√5","√25"],"Les deux termes ont le même radical : (3 + 2)√5 = 5√5.","Additionne les coefficients, sans changer le radical."),
 make("Un carré a une aire de 121 cm². Quelle est la longueur de son côté ?","11 cm",["12 cm","60,5 cm","22 cm"],"Le côté vaut √121 = 11 cm, car 11² = 121.","Quel nombre positif multiplié par lui-même donne 121 ?"),
 make("Que vaut √18 × √2 ?","6",["20","3√2","36"],"√18 × √2 = √36 = 6.","Tu peux regrouper les deux facteurs sous une seule racine."),
 make("Que vaut √(64 / 25) ?","8 / 5",["32 / 5","8 / 25","64 / 5"],"La racine d’un quotient est le quotient des racines : √64 / √25 = 8 / 5.","Calcule séparément les racines de 64 et de 25."),
 make("Quelle écriture de 6 / √3 a un dénominateur rationnel ?","2√3",["3√2","6√3","2 / 3"],"En multipliant en haut et en bas par √3, on obtient 6√3 / 3 = 2√3.","Multiplie le numérateur et le dénominateur par √3."),
 make("Quelle égalité est correcte ?","√(9 + 16) = 5",["√(9 + 16) = 7","√9 + √16 = 5","√(9 × 16) = 7"],"9 + 16 = 25 et √25 = 5. En revanche, √9 + √16 = 7.","Effectue d’abord les opérations à l’intérieur de la racine.")
 ],
 [
 make("ABC est rectangle en A. Si AB = 6 cm et AC = 8 cm, combien mesure BC ?","10 cm",["14 cm","100 cm","7 cm"],"BC² = 6² + 8² = 100. Donc BC = 10 cm.","BC est le côté opposé à l’angle droit."),
 make("Dans un triangle rectangle, l’hypoténuse mesure 13 cm et un côté de l’angle droit 5 cm. Calcule l’autre côté.","12 cm",["8 cm","18 cm","√194 cm"],"Le carré du côté cherché vaut 13² − 5² = 144. Sa longueur est 12 cm.","Isole le carré du côté cherché avant de prendre la racine."),
 make("AB = 7 cm, AC = 24 cm et BC = 25 cm. Que prouve la réciproque de Pythagore ?","ABC est rectangle en A",["ABC est rectangle en B","ABC est rectangle en C","ABC est équilatéral"],"7² + 24² = 49 + 576 = 625 = 25². L’angle droit est opposé à [BC].","Repère le plus grand côté et compare les carrés."),
 make("Un triangle de côtés 4 cm, 5 cm et 6 cm est-il rectangle ?","Non, car 4² + 5² ≠ 6²",["Oui, car 4 + 5 > 6","Oui, car 6 est le plus grand côté","Non, car ses côtés sont différents"],"4² + 5² = 41, tandis que 6² = 36. L’égalité de Pythagore n’est pas vérifiée.","Si le triangle était rectangle, le plus long côté serait l’hypoténuse."),
 make("Un rectangle mesure 9 cm de long et 4 cm de large. Quelle est la longueur exacte de sa diagonale ?","√97 cm",["13 cm","√65 cm","97 cm"],"Une diagonale forme un triangle rectangle avec les deux côtés : d² = 9² + 4² = 97.","La diagonale est l’hypoténuse d’un triangle rectangle."),
 make("Dans un triangle RST rectangle en S, quelle égalité est correcte ?","RT² = RS² + ST²",["RS² = RT² + ST²","ST² = RS² + RT²","RT = RS + ST"],"L’hypoténuse [RT] est opposée à l’angle droit en S.","Le côté ne contenant pas le sommet de l’angle droit est l’hypoténuse.")
 ],
 [
 make("M ∈ [AB], N ∈ [AC] et (MN) ∥ (BC). Si AM = 3 cm, AB = 9 cm et AC = 12 cm, calcule AN.","4 cm",["36 cm","6 cm","3 cm"],"Par Thalès, AN / 12 = 3 / 9. Donc AN = 12 × 3 / 9 = 4 cm.","Écris AM / AB = AN / AC."),
 make("Dans ABC, M ∈ [AB], N ∈ [AC] et (MN) ∥ (BC). Si AM / AB = 2 / 5 et BC = 15 cm, calcule MN.","6 cm",["37,5 cm","10 cm","3 cm"],"MN / BC = AM / AB = 2 / 5. Ainsi MN = 15 × 2 / 5 = 6 cm.","La petite base et la grande base suivent le même rapport."),
 make("M ∈ [AB] et N ∈ [AC]. On sait que AM / AB = AN / AC = 0,6. Que peut-on conclure ?","(MN) ∥ (BC)",["(MN) ⟂ (BC)","MN = BC","AB = AC"],"Avec les alignements dans le même ordre et l’égalité des rapports, la réciproque de Thalès donne (MN) ∥ (BC).","Il s’agit du sens réciproque du théorème."),
 make("En configuration papillon, A est entre M et B, et entre N et C. Si (MN) ∥ (BC), AM = 4 cm, AB = 6 cm et AN = 8 cm, calcule AC.","12 cm",["3 cm","10 cm","16 cm"],"Thalès s’applique aussi en papillon : 4 / 6 = 8 / AC, d’où AC = 8 × 6 / 4 = 12 cm.","Les côtés correspondants sont portés par les mêmes droites."),
 make("M ∈ [AB], N ∈ [AC] et (MN) ∥ (BC). Quel rapport est égal à AM / AB ?","MN / BC",["BC / MN","AC / AN","AM / AC"],"Les côtés de AMN sont au numérateur et ceux de ABC au dénominateur : AM / AB = AN / AC = MN / BC.","Ne mélange pas le sens petit / grand et le sens grand / petit."),
 make("M ∈ [AB], N ∈ [AC]. AM = 2 cm, AB = 5 cm, AN = 3 cm et AC = 6 cm. Les droites (MN) et (BC) sont-elles parallèles ?","Non, car 2 / 5 ≠ 3 / 6",["Oui, car M et N sont sur les côtés","Oui, car 2 < 5 et 3 < 6","On ne peut jamais le savoir"],"2 / 5 = 0,4 et 3 / 6 = 0,5. Si les droites étaient parallèles, Thalès donnerait des rapports égaux.","Compare les deux rapports de longueurs correspondantes.")
 ]
];
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startQuiz(mode){let list=[];if(mode===-1){bank.forEach((b,i)=>shuffle(b).slice(0,2).forEach(q=>list.push({...q,topic:i})));list=shuffle(list)}else list=shuffle(bank[mode]).slice(0,4).map(q=>({...q,topic:mode}));
quiz={mode,list:list.map(q=>({...q,options:shuffle([q.a,...q.others])})),index:0,score:0,answered:false,answers:[]};view="quiz";drawQuestion()}
function drawQuestion(){let q=quiz.list[quiz.index],n=quiz.list.length;render(`<div class="quiz-wrap c${q.topic}"><div class="quiz-top"><button class="back" onclick="navigateHome()">${icon("back")} Quitter le quiz</button><span class="eyebrow">${icon("flag",14)} ${quiz.mode===-1?"Le défi de l’Atlas":"Quiz de l’atelier"}</span></div><section class="quiz-card"><div class="quiz-label"><span class="eyebrow">${icon("book",15)} ${topics[q.topic].short}</span><span>+10 XP / réponse juste</span></div><div class="quiz-inner"><div class="q-meta"><span>Question <strong>${quiz.index+1}</strong> sur ${n}</span><span id="qscore">Score : ${quiz.score} / ${n}</span></div><div class="q-track"><i id="qprogress" style="width:${quiz.index/n*100}%"></i></div><h2 id="question">${q.q}</h2><div class="choices" role="group" aria-labelledby="question">${q.options.map((o,i)=>`<button class="choice" onclick="answer(${i})"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div><div id="qFeedback" aria-live="polite"></div><div id="quizHint" class="hint" hidden>${q.hint}</div><div class="quiz-tools"><button id="hintBtn" class="textbtn" aria-expanded="false" onclick="showHint()">${icon("bulb",15)} Un indice ?</button><button id="nextBtn" class="btn" onclick="nextQuestion()" hidden>${quiz.index+1===n?"Voir mon résultat":"Question suivante"} ${icon("arrow",16)}</button></div></div></section></div>`)}
function showHint(){let b=$("hintBtn"),h=$("quizHint");h.hidden=!h.hidden;b.setAttribute("aria-expanded",String(!h.hidden));b.innerHTML=icon("bulb",15)+(h.hidden?"Un indice ?":"Masquer l’indice")}
function answer(i){if(view!=="quiz"||quiz.answered)return;let q=quiz.list[quiz.index],ans=q.options[i],ok=ans===q.a;quiz.answered=true;quiz.answers.push(ans);if(ok){quiz.score++;gain(10)}tone(ok);document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.a)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});$("qFeedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Bien joué ! +10 XP":"Pas tout à fait. Réponse : "+q.a+"."}</strong><br>${q.why}</div>`;$("qscore").textContent=`Score : ${quiz.score} / ${quiz.list.length}`;$("qprogress").style.width=(quiz.index+1)/quiz.list.length*100+"%";$("hintBtn").hidden=true;$("quizHint").hidden=true;$("nextBtn").hidden=false;$("nextBtn").focus({preventScroll:true})}
function nextQuestion(){if(view!=="quiz"||!quiz.answered)return;if(quiz.index+1<quiz.list.length){quiz.index++;quiz.answered=false;drawQuestion()}else finishQuiz()}
function finishQuiz(){const s=quiz.score,n=quiz.list.length,m=quiz.mode;view="result";if(m>=0){saved.bests[m]=Math.max(saved.bests[m],s);store()}const msg=m===-1?(s===n?"Un sans-faute sur les trois chapitres !":"Retrouve les explications ci-dessous, puis explore les ateliers pour progresser."):(s>=3?`L’atelier « ${topics[m].name} » est validé. Bravo !`:"Encore un peu d’entraînement : vise 3 réponses justes sur 4 pour valider l’atelier.");
render(`<div class="result"><div class="result-top"><div class="medal">${starLogo(67)}</div><span class="eyebrow">${m===-1?"Le défi de l’Atlas":topics[m].short}</span><h1>${s===n?"Un parcours parfait !":s>=n*.65?"Belle réussite !":"Quiz terminé !"}</h1></div><div class="result-body"><p>${msg}</p><div class="statrow"><div class="stat"><strong>${s} / ${n}</strong><small>Bonnes réponses</small></div><div class="stat"><strong>+${s*10} XP</strong><small>Points gagnés</small></div></div><div class="lesson-actions"><button class="btn ghost" onclick="${m===-1?"home()":`openLesson(${m})`}">${m===-1?"Tableau de bord":"Revoir le cours"}</button><button class="btn" onclick="startQuiz(${m})">Rejouer ${icon("arrow",15)}</button></div><details class="review"><summary>Consulter mon corrigé (${n} questions)</summary><ol>${quiz.list.map((q,i)=>`<li><strong>${q.q}</strong><br>Ta réponse : ${quiz.answers[i]} · ${quiz.answers[i]===q.a?"Correct":"À revoir"}<br>${q.why}</li>`).join("")}</ol></details></div></div>`)}
$("brandmark").innerHTML=starLogo(31);$("footbrand").innerHTML=starLogo(17)+" Atlas des Maths · Apprendre en pratiquant";home();
</script>
